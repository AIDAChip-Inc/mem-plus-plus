[project]
name = "memory-research"
version = "0.1.0"
description = "Self-contained, faithful replica of the AIDAChip team-memory engine (recall + write core, ONNX MiniLM-384, pgvector RRF)."
requires-python = ">=3.13"
dependencies = [
    "sqlalchemy==2.0.48",
    "psycopg2-binary==2.9.11",
    "pgvector>=0.3.0",
    "alembic==1.18.4",
    "pydantic>=2.0",
    "numpy>=2.0",
    # In-process ONNX MiniLM-384 embedder (torch-free, cross-platform).
    "onnxruntime>=1.18.0",
    "tokenizers>=0.20.0",
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
# Pluggable extraction LLM (store_facts). Absent -> extraction degrades to no-op.
llm = ["anthropic>=0.86.0"]
# OpenAI embedding backend (MEMORY_EMBEDDING_BACKEND=openai) and GPT answer/judge
# models in the eval harness. Both import it lazily, so it stays optional.
openai = ["openai>=3.2,<4"]
test = ["pytest>=8.0", "pytest-cov>=5.0"]
# Local chat demo (chat/): Gradio UI over the engine's per-turn hooks. Pulls the
# `llm` extra (anthropic SDK) for reply generation (memory.llm.llm_call) rather
# than re-pinning it.
chat = ["gradio>=5.0,<6", "memory-research[llm]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memory"]

[tool.pytest.ini_options]
testpaths = ["tests_engine", "tests", "eval/tests", "chat"]
